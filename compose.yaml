name: nestly
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /data/photos
      AUTHORIZATION_DIR: /data/documents
      STORAGE_DURABLE: 'true'
      CLAMD_HOST: scanner
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - photos:/data/photos
      - documents:/data/documents
    expose: ['8080']
    mem_limit: 768m
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      scanner:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  scanner:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - signatures:/var/lib/clamav
    expose: ['3310']
    mem_limit: 4g
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.production
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on: [app]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  photos:
  documents:
  signatures:
  caddy_data:
  caddy_config:
