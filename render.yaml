services:
  - type: web
    name: pg-dekho
    runtime: docker
    region: singapore
    plan: free
    branch: feat/nestly-pg-finder
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_URL
        sync: false
