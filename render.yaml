services:
  - type: web
    name: pg-dekho
    runtime: docker
    region: singapore
    plan: standard
    branch: feat/nestly-pg-finder
    healthCheckPath: /health/ready
    disk:
      name: pg-dekho-media
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: STORAGE_DURABLE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_WEBHOOK_SECRET
        sync: false
